# Sobe aplicação + PostgreSQL + provedor simulado (WireMock) + servidor OAuth 2.0 fake.
#   docker compose up --build
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
      PROVIDER_BASE_URL: http://provider-mock:8080
      PROVIDER_API_KEY: local-provider-key
      # O token é pedido pelo host (localhost:8090), então esse é o emissor gravado nele;
      # as chaves públicas são buscadas pela rede interna do compose.
      JWT_ISSUER_URI: http://localhost:8090/default
      JWT_JWK_SET_URI: http://mock-oauth2:8080/default/jwks
      JWT_AUDIENCE: activation-api
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_started
      mock-oauth2:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5433:5432" # 5433 no host para não colidir com um Postgres local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro
    command: ["--global-response-templating", "--disable-banner"]

  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG_PATH: /config/mock-oauth2.json
    volumes:
      - ./docker/mock-oauth2.json:/config/mock-oauth2.json:ro
