spring:
  application:
    name: activation-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        # deixa o ciclo do dispatcher em andamento terminar antes de fechar o pool de conexões
        await-termination: true
        await-termination-period: 15s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Chaves públicas do servidor de autorização (JWKS) + emissor e audiência esperados.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}
          audiences: ${JWT_AUDIENCE:activation-api}

server:
  port: ${PORT:8080}
  shutdown: graceful
  # atrás de load balancer/ingress: Location e URLs usam o host/esquema originais (X-Forwarded-*)
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

app:
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    api-key: ${PROVIDER_API_KEY:}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
  dispatch:
    enabled: ${DISPATCH_ENABLED:true}
    poll-interval: ${DISPATCH_POLL_INTERVAL:1s}
    batch-size: ${DISPATCH_BATCH_SIZE:20}
    # precisa ser maior que connect-timeout + read-timeout
    lease: ${DISPATCH_LEASE:30s}
    max-attempts: ${DISPATCH_MAX_ATTEMPTS:5}
    base-backoff: ${DISPATCH_BASE_BACKOFF:2s}
    max-backoff: ${DISPATCH_MAX_BACKOFF:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        activation.provider.calls: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
  include-application-name: false
